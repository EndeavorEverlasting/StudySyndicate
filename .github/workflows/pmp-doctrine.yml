name: PMP Doctrine

on:
  pull_request:
    paths:
      - docs/PMP_STUDY_SYSTEM.md
      - content/pmp/mvp-spec.v1.json
      - scripts/validate-pmp-doctrine.py
      - .github/workflows/pmp-doctrine.yml

permissions:
  contents: read

jobs:
  validate-pmp-doctrine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate PMP doctrine and MVP spec
        run: python scripts/validate-pmp-doctrine.py

      - name: Check doctrine diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

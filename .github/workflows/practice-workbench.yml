name: Practice Workbench

on:
  pull_request:
    paths:
      - "package.json"
      - "index.html"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "src/**"
      - "harness/practice-workbench.v1.json"
      - "harness/problems/problem-packet-contract.v1.json"
      - "harness/workflows/PRACTICE_WORKBENCH.md"
      - "harness/skills/runner-adapter/SKILL.md"
      - "scripts/validate-practice-workbench.py"
      - "tests/test_practice_workbench_contract.py"
      - ".github/workflows/practice-workbench.yml"

permissions:
  contents: read

jobs:
  validate-workbench:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate workbench contract
        run: python scripts/validate-practice-workbench.py

      - name: Test workbench contracts
        run: python tests/test_practice-workbench_contract.py

      - name: Lint app
        run: npm run lint

      - name: Build app
        run: npm run build

      - name: Check PR diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

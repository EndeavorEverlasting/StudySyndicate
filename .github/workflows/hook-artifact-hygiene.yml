name: Hook Artifact Hygiene

on:
  pull_request:
    paths:
      - ".gitignore"
      - ".githooks/**"
      - "scripts/check-staged-artifacts.py"
      - "tests/test_hook_artifact_hygiene.py"
      - "docs/LOCAL_ARTIFACT_HYGIENE.md"
      - ".github/workflows/hook-artifact-hygiene.yml"

permissions:
  contents: read

jobs:
  focused-hook-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run hook artifact hygiene tests
        run: python tests/test_hook_artifact_hygiene.py

      - name: Check PR diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

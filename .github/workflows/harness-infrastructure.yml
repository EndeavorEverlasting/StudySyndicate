name: Harness Infrastructure

on:
  pull_request:
    paths:
      - "harness/**"
      - "content/learning/**"
      - "docs/LEARNING_EVIDENCE_DOCTRINE.md"
      - "scripts/harness.py"
      - "scripts/validate-harness.py"
      - "scripts/validate-canonical-paths.py"
      - "scripts/validate-promotion.py"
      - "scripts/promotion.py"
      - "scripts/application-e2e.py"
      - "scripts/validate-practice-workbench.py"
      - "scripts/learning-evidence.py"
      - "scripts/source-ingest-youtube.py"
      - "scripts/validate-source-ingestion.py"
      - "scripts/Resolve-StudySyndicateRepo.ps1"
      - "scripts/Test-RepoLocationRecovery.ps1"
      - "tests/test_promotion_contract.py"
      - "tests/test_practice-workbench_contract.py"
      - "tests/test_learning_evidence_engine.py"
      - "tests/test_youtube_source_ingestion.py"
      - ".githooks/**"
      - ".github/workflows/harness-infrastructure.yml"
      - ".github/workflows/promote-main.yml"
      - "src/**"
      - "index.html"
      - "package.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "README.md"

permissions:
  contents: read

jobs:
  validate-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser dependencies
        run: npm install --no-audit --no-fund

      - name: Inspect harness
        run: python scripts/harness.py inspect

      - name: Run full registered validation floor
        run: python scripts/harness.py validate --level full

      - name: Check PR diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
